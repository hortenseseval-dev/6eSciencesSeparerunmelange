<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'eau limpide</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Patrick+Hand&display=swap">
<style>
/* Layout : même cahier de chercheur que « Le labo des liquides » ; un niveau = une page ; grosses cibles tactiles. */
:root{
  --paper:#fbfcff; --rule:#d9e3f5; --margin:#f0a5a5;
  --ink:#1d2a44; --soft:#5a6787; --card:#ffffff; --line:#c9d3e6;
  --accent:#1f7a6b; --accent-ink:#ffffff; --accent-soft:#dcf0eb;
  --ok:#2e7d32; --ok-soft:#e3f3e4; --ko:#b3361e; --ko-soft:#fbe7e2;
  --mud:#8a6a43; --mud-deep:#5e4329; --clear:#d6ecf8; --clear-ink:#7fb6d9; --stone:#9aa0a6; --sand:#e2c48a; --filter:#f6f1e4; --plate:#3a3f4a; --plate-in:#2c313b; --sun:#e8b630;
  --display:"Patrick Hand","Andika","Comic Sans MS",system-ui,sans-serif;
  --body:"Andika","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#141b2b; --rule:#22304a; --margin:#5b2f38;
  --ink:#e8eefb; --soft:#a6b2cc; --card:#1c2538; --line:#33425f;
  --accent:#4cc2ab; --accent-ink:#0d1a17; --accent-soft:#183a35;
  --ok:#7ccf80; --ok-soft:#1b3420; --ko:#f08a72; --ko-soft:#3d1f19;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#141b2b; --rule:#22304a; --margin:#5b2f38;
  --ink:#e8eefb; --soft:#a6b2cc; --card:#1c2538; --line:#33425f;
  --accent:#4cc2ab; --accent-ink:#0d1a17; --accent-soft:#183a35;
  --ok:#7ccf80; --ok-soft:#1b3420; --ko:#f08a72; --ko-soft:#3d1f19;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;
  background-image:linear-gradient(90deg,transparent 0,transparent calc(max(16px,env(safe-area-inset-left,0px)) + 18px),var(--margin) calc(max(16px,env(safe-area-inset-left,0px)) + 18px),var(--margin) calc(max(16px,env(safe-area-inset-left,0px)) + 20px),transparent calc(max(16px,env(safe-area-inset-left,0px)) + 20px)),
  repeating-linear-gradient(180deg,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-left:28px}
h1{font-family:var(--display);font-size:clamp(2rem,6vw,2.8rem);line-height:1.05;margin:0;text-wrap:balance}
.eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);margin:0 0 2px}
h2{font-family:var(--display);font-size:1.8rem;margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,.slot:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:12px 18px;font-weight:700;min-height:52px}
.btn:hover{background:var(--accent-soft)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{border-color:var(--line);font-weight:400}
.btn[disabled]{opacity:.45;cursor:default}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px;margin-top:22px}
.level{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;min-height:150px}
.level:hover{border-color:var(--accent)}
.level .num{font-family:var(--display);font-size:1rem;color:var(--soft)}
.level .name{font-family:var(--display);font-size:1.6rem;line-height:1.1}
.level .what{color:var(--soft);font-size:.95rem}
.stars{margin-top:auto;display:flex;gap:4px}
.stars svg{width:22px;height:22px}
.intro{margin:18px 0 0 28px;max-width:62ch;color:var(--soft)}
.screen{margin-top:18px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:18px clamp(14px,3vw,26px) 22px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}
.progress{display:flex;gap:6px}
.progress i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);display:block}
.progress i.done{background:var(--accent);border-color:var(--accent)}
.progress i.now{border-color:var(--accent)}
.consigne{display:flex;gap:12px;align-items:flex-start;margin:14px 0 6px}
.consigne p{margin:0;font-size:1.25rem;font-weight:700;max-width:60ch}
.speak{flex:none;width:48px;height:48px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);display:grid;place-items:center}
.speak svg{width:24px;height:24px;stroke:var(--accent)}
.scene{display:flex;justify-content:center;margin:8px 0}
.scene svg{width:100%;max-width:440px;height:auto}
.choices{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:10px}
.choices .btn{min-width:150px;font-size:1.1rem}
.choice.right{background:var(--ok-soft);border-color:var(--ok)}
.choice.wrong{background:var(--ko-soft);border-color:var(--ko)}
.feedback{margin-top:14px;border-radius:14px;padding:12px 16px;font-size:1.05rem;display:flex;gap:10px;align-items:flex-start}
.feedback.ok{background:var(--ok-soft);border:2px solid var(--ok)}
.feedback.ko{background:var(--ko-soft);border:2px solid var(--ko)}
.feedback b{display:block}
.next{display:flex;justify-content:flex-end;margin-top:14px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:14px}
.mini{border:2px solid var(--line);border-radius:14px;padding:8px;text-align:center;font-size:.95rem}
.mini svg{width:100%;height:auto}
.tube-area{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;align-items:flex-end;margin-top:16px}
.tube{display:flex;flex-direction:column;border:4px solid var(--ink);border-top:none;border-radius:0 0 46px 46px;width:150px;overflow:hidden;background:var(--paper)}
.slot{height:76px;border-bottom:2px dashed var(--line);display:grid;place-items:center;font-family:var(--display);font-size:1.6rem;background:transparent;border-left:none;border-right:none;border-top:none;width:100%}
.slot:last-child{border-bottom:none;height:90px}
.slot.ok{outline:3px solid var(--ok);outline-offset:-6px}
.slot.ko{outline:3px solid var(--ko);outline-offset:-6px}
.tags{display:flex;flex-direction:column;gap:10px}
.tag{width:84px;height:62px;border-radius:12px;border:3px solid var(--ink);font-family:var(--display);font-size:1.7rem}
.tag.sel{outline:4px solid var(--accent);outline-offset:3px}
.tag.used{opacity:.3}
.slotlabels{display:flex;flex-direction:column;justify-content:space-between;height:242px;color:var(--soft);font-size:.9rem;padding-bottom:30px}
.end{text-align:center;padding:10px 0}
.end .big{font-family:var(--display);font-size:2.6rem;margin:6px 0}
.rule{display:inline-block;margin-top:10px;background:var(--accent-soft);border-radius:12px;padding:10px 16px;font-weight:700}
.muted{color:var(--soft);font-size:.95rem}
.couple{font-family:var(--display);font-size:1.9rem;text-align:center;margin:6px 0}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.choices.stack{flex-direction:column;align-items:stretch;max-width:560px;margin-inline:auto}
.choices.stack .btn{text-align:left}
.situation{font-family:var(--display);font-size:1.7rem;line-height:1.2;text-align:center;margin:16px auto;max-width:28ch;text-wrap:balance}
.idea{border:2px dashed var(--line);border-radius:14px;padding:10px 16px;margin:8px 0;max-width:560px}
.idea .tagline{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft)}
.idea p{margin:2px 0 0;font-family:var(--display);font-size:1.5rem;line-height:1.2}
.result{max-width:60ch;margin:4px 0 8px}
.photo svg{background:var(--paper);border:6px solid var(--card);outline:2px solid var(--line);border-radius:6px}
.big-stars{justify-content:center;margin-top:10px}.big-stars svg{width:40px;height:40px}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div>
      <p class="eyebrow">Sciences 6e · investigation 05</p>
      <h1>L'eau limpide</h1>
    </div>
    <button class="btn ghost" id="home" hidden>Retour aux niveaux</button>
  </header>
  <main id="app"></main>
</div>

<script>
(function(){
"use strict";
var app=document.getElementById("app"), homeBtn=document.getElementById("home");
var canSpeak=("speechSynthesis" in window)&&typeof SpeechSynthesisUtterance!=="undefined";

function loadStars(){try{return JSON.parse(localStorage.getItem("eau-limpide-stars")||"{}")}catch(e){return {}}}
function saveStars(s){try{localStorage.setItem("eau-limpide-stars",JSON.stringify(s))}catch(e){}}
var stars=loadStars();

function el(tag,attrs,html){var e=document.createElement(tag);if(attrs)for(var k in attrs){if(k==="class")e.className=attrs[k];else e.setAttribute(k,attrs[k]);}if(html!=null)e.innerHTML=html;return e}
function speak(text){if(!canSpeak)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(text);u.lang="fr-FR";u.rate=.9;speechSynthesis.speak(u)}catch(e){}}
var SPEAK_ICON='<svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function starSvg(on){return '<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.2 6.3 20.3l1.2-6.4L2.8 9.5l6.4-.8z" fill="'+(on?"var(--sun)":"none")+'" stroke="var(--ink)" stroke-width="1.4" stroke-linejoin="round"/></svg>'}
function consigne(text){var c=el("div",{class:"consigne"});if(canSpeak){var b=el("button",{class:"speak","aria-label":"Écouter la consigne",type:"button"},SPEAK_ICON);b.onclick=function(){speak(text)};c.appendChild(b)}c.appendChild(el("p",null,text));return c}
function feedback(ok,title,text){return el("div",{class:"feedback "+(ok?"ok":"ko"),role:"status"},"<div><b>"+title+"</b>"+text+"</div>")}

/* ---------- dessins ---------- */
// trouble : 0 = limpide, 1 = très trouble ; depot : hauteur du dépôt en px
function glass(x,trouble,depot,label,sub){
  var top=60,bot=200,w=90;
  var fill="color-mix(in srgb, var(--mud) "+Math.round(trouble*100)+"%, var(--clear))";
  var s='<path d="M'+(x-w/2)+' '+(top+20)+' L'+(x-w/2+8)+' '+bot+' H'+(x+w/2-8)+' L'+(x+w/2)+' '+(top+20)+' Z" fill="'+fill+'"/>';
  if(depot>0)s+='<path d="M'+(x-w/2+8-depot*0.06)+' '+(bot-depot)+' Q'+x+' '+(bot-depot-6)+' '+(x+w/2-8+depot*0.06)+' '+(bot-depot)+' L'+(x+w/2-8)+' '+bot+' H'+(x-w/2+8)+' Z" fill="var(--mud-deep)"/>';
  s+='<path d="M'+(x-w/2-4)+' '+top+' L'+(x-w/2+6)+' '+(bot+2)+' H'+(x+w/2-6)+' L'+(x+w/2+4)+' '+top+'" fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>';
  if(label)s+='<text x="'+x+'" y="'+(bot+26)+'" text-anchor="middle" font-family="var(--body)" font-weight="700" font-size="17" fill="var(--ink)">'+label+'</text>';
  if(sub)s+='<text x="'+x+'" y="'+(bot+46)+'" text-anchor="middle" font-family="var(--body)" font-size="15" fill="var(--soft)">'+sub+'</text>';
  return s;
}
var TOOLS={
  passoire:{name:"la passoire",hole:14,label:"gros trous"},
  chinois:{name:"le chinois",hole:6,label:"petits trous"},
  filtre:{name:"le filtre à café",hole:0,label:"trous invisibles"}
};
var GRAINS={
  cailloux:{name:"des petits cailloux",r:11,color:"var(--stone)"},
  sable:{name:"du sable",r:4,color:"var(--sand)"},
  terre:{name:"de la terre fine",r:1.6,color:"var(--mud-deep)"},
  sel:{name:"du sel dissous",r:0,color:"none"}
};
function sieve(tool){
  var t=TOOLS[tool],s='<path d="M120 40 H320 L240 150 V200 H200 V150 Z" fill="var(--paper)" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round"/>';
  if(tool==="filtre"){s+='<path d="M136 48 H304 L232 146 H208 Z" fill="var(--filter)" stroke="var(--soft)" stroke-width="1.5"/>';}
  else{var rr=t.hole/2,step=t.hole+8;for(var y=60;y<140;y+=step){var span=(140-y)*0.8+10;for(var x=220-span;x<=220+span;x+=step){s+='<circle cx="'+x+'" cy="'+y+'" r="'+rr+'" fill="var(--card)" stroke="var(--soft)" stroke-width="1.2"/>'}}}
  return s;
}
function grainsAt(grain,cx,cy,n,spread){var g=GRAINS[grain],s="";if(!g.r)return s;for(var i=0;i<n;i++){var a=i*2.39996,rad=spread*Math.sqrt((i+.5)/n);s+='<circle cx="'+(cx+Math.cos(a)*rad).toFixed(1)+'" cy="'+(cy+Math.sin(a)*rad*0.45).toFixed(1)+'" r="'+g.r+'" fill="'+g.color+'" stroke="var(--ink)" stroke-width="'+(g.r>3?1:0)+'"/>'}return s}
function sieveScene(tool,grain){
  return '<svg viewBox="0 0 440 290" role="img" aria-label="Eau avec '+GRAINS[grain].name+' versée dans '+TOOLS[tool].name+'">'+
    '<path d="M60 20 l40 0 l-6 30 l-28 0 Z" fill="color-mix(in srgb, var(--mud) 60%, var(--clear))" stroke="var(--ink)" stroke-width="2.5"/>'+
    '<path d="M100 30 Q120 34 140 52" fill="none" stroke="var(--clear-ink)" stroke-width="4" stroke-linecap="round"/>'+
    sieve(tool)+grainsAt(grain,220,62,grain==="cailloux"?9:28,60)+
    '<path d="M160 214 L168 270 H272 L280 214" fill="none" stroke="var(--ink)" stroke-width="3"/>'+
    '<text x="432" y="172" text-anchor="end" font-family="var(--display)" font-size="21" fill="var(--ink)">'+TOOLS[tool].name.replace("le ","").replace("la ","")+'</text>'+
    '<text x="432" y="194" text-anchor="end" font-family="var(--body)" font-size="15" fill="var(--soft)">'+TOOLS[tool].label+'</text>'+
    '<text x="24" y="90" font-family="var(--body)" font-size="15" fill="var(--soft)">eau +</text>'+
    '<text x="24" y="110" font-family="var(--body)" font-size="15" fill="var(--soft)">'+GRAINS[grain].name.replace("des ","").replace("du ","").replace("de la ","")+'</text></svg>';
}
function plate(crust){
  var s='<svg viewBox="0 0 440 200" role="img" aria-label="Assiette foncée après évaporation">'+
    '<ellipse cx="220" cy="110" rx="170" ry="58" fill="var(--plate)" stroke="var(--ink)" stroke-width="3"/>'+
    '<ellipse cx="220" cy="106" rx="112" ry="34" fill="var(--plate-in)"/>';
  if(crust){for(var i=0;i<70;i++){var a=i*2.39996,r=62*Math.sqrt((i+.5)/70);s+='<rect x="'+(220+Math.cos(a)*r*1.4).toFixed(1)+'" y="'+(106+Math.sin(a)*r*0.42).toFixed(1)+'" width="5" height="5" transform="rotate('+(i*37%90)+' '+(220+Math.cos(a)*r*1.4).toFixed(1)+' '+(106+Math.sin(a)*r*0.42).toFixed(1)+')" fill="#f4f4f0" stroke="#bdbdb5" stroke-width=".6"/>'}}
  return s+'</svg>';
}

/* ---------- données ---------- */
var L1=[
  {txt:"On égoutte des pâtes avec une passoire.",a:1},
  {txt:"Une bouteille d'eau boueuse reste sur la table. La terre tombe au fond.",a:0},
  {txt:"Le café coule à travers le papier de la cafetière.",a:1},
  {txt:"Après la pluie, une flaque devient plus claire toute seule.",a:0},
  {txt:"On passe du sable dans un tamis pour retirer les cailloux.",a:1},
  {txt:"On laisse une carafe d'eau de rivière toute la nuit sans y toucher.",a:0}
];
var L2=[
  {tool:"passoire",grain:"cailloux",stay:true,why:"Les cailloux sont plus gros que les trous de la passoire : ils restent dedans."},
  {tool:"passoire",grain:"sable",stay:false,why:"Les grains de sable sont plus petits que les trous de la passoire : ils passent."},
  {tool:"chinois",grain:"sable",stay:true,why:"Les trous du chinois sont plus petits que les grains de sable : le sable reste."},
  {tool:"chinois",grain:"terre",stay:false,why:"La terre fine est plus petite que les trous du chinois : elle passe, l'eau reste trouble."},
  {tool:"filtre",grain:"terre",stay:true,why:"Les trous du filtre sont si petits qu'on ne les voit pas : la terre fine reste, l'eau sort limpide."},
  {tool:"filtre",grain:"sel",stay:false,why:"Le sel est dissous : il est mélangé à l'eau et passe avec elle, même à travers le filtre."}
];
var L3=[
  {q:"On a filtré une eau boueuse et salée. Elle est limpide. Le sel est-il parti ?",opts:["Oui, il est parti","Non, il est encore dans l'eau"],a:1,
   ok:"Le filtre retient les grains, pas le sel dissous. On ne le voit plus, mais il est encore là.",ko:"Le sel est dissous : il passe à travers le filtre avec l'eau."},
  {q:"Comment prouver que le sel est encore dans l'eau filtrée ?",opts:["Bien regarder l'eau","Faire sécher quelques gouttes dans une assiette","Filtrer une deuxième fois"],a:1,
   ok:"Quand l'eau s'en va, le sel reste dans l'assiette. Avec un sèche-cheveux, ça va plus vite.",ko:"Regarder ne suffit pas : le sel est invisible. Et le filtre le laisse passer."},
  {q:"On a fait sécher l'eau filtrée dans une assiette foncée. Que voit-on ?",plate:true,opts:["Rien du tout","Une croûte blanche de sel","De la terre"],a:1,
   ok:"C'est le sel : il était dans l'eau limpide depuis le début.",ko:"Regarde l'assiette : ces petits cristaux blancs, c'est le sel qui était dissous."},
  {q:"Vrai ou faux : une eau limpide est forcément bonne à boire.",opts:["Vrai","Faux"],a:1,
   ok:"Limpide veut dire claire. Elle peut contenir du sel ou des microbes qu'on ne voit pas.",ko:"Pense au sel : l'eau filtrée était limpide, et pourtant pas pure."},
  {q:"Vrai ou faux : le filtre à café n'a pas de trous, puisqu'on ne les voit pas.",opts:["Vrai","Faux"],a:1,
   ok:"L'eau passe à travers le filtre : c'est la preuve qu'il a des trous, tout petits.",ko:"Si le filtre n'avait pas de trous, l'eau ne pourrait pas passer."},
  {q:"Vrai ou faux : si je ne vois plus quelque chose, c'est qu'il a disparu.",opts:["Vrai","Faux"],a:1,
   ok:"Le sel dans l'eau, les trous du filtre, la vapeur : on ne les voit pas, et pourtant ils sont là.",ko:"Souviens-toi de la croûte de sel dans l'assiette."}
];
var L4=[
  {who:"Lina",idea:"Il suffit d'attendre pour que l'eau devienne limpide.",scene:"wait",
   result:"Après 20 minutes, il y a de la terre au fond, l'eau est plus claire, mais encore un peu trouble.",
   verdict:2,reasons:["La décantation, c'est quand on laisse reposer.","J'ai vu que l'eau s'est éclaircie mais qu'elle reste un peu trouble.","Parce que 20 minutes, c'est long."],good:1},
  {who:"Noa",idea:"Avec la passoire, l'eau sera limpide.",scene:"passoire",
   result:"L'eau qui sort de la passoire est aussi trouble qu'avant.",
   verdict:1,reasons:["J'ai vu que l'eau restait trouble : la terre passe par les trous.","Une passoire, ça sert pour les pâtes.","La filtration retient les grains."],good:0},
  {who:"Sami",idea:"Avec le filtre à café, l'eau sera plus claire qu'avec la passoire.",scene:"filtre",
   result:"L'eau du filtre est limpide. La terre est restée sur le papier.",
   verdict:0,reasons:["Le filtre est en papier.","J'ai vu que l'eau du filtre est limpide et que la terre est restée sur le papier.","Les filtres sont faits pour le café."],good:1},
  {who:"Inès",idea:"Après le filtre, il n'y a plus de sel dans l'eau.",scene:"plate",
   result:"On fait sécher l'eau filtrée : une croûte blanche reste dans l'assiette.",
   verdict:1,reasons:["Le sel est soluble.","On ne doit pas goûter en sciences.","J'ai vu une croûte blanche de sel dans l'assiette après avoir fait sécher l'eau."],good:2}
];
var VERDICTS=["Son idée tient","Son idée ne tient pas","Son idée tient en partie"];
var LEVELS=[
  {id:"r1",name:"Reposer ou filtrer ?",what:"Décantation ou filtration : reconnais la méthode.",n:L1.length+1},
  {id:"r2",name:"La taille des trous",what:"Passoire, chinois, filtre : qu'est-ce qui passe ?",n:L2.length+1},
  {id:"r3",name:"Limpide ou pure ?",what:"L'eau est claire. Est-ce qu'elle est pure ?",n:L3.length},
  {id:"r4",name:"Je conclus",what:"Tient, ne tient pas, ou en partie : avec un parce que vu.",n:L4.length}
];

/* ---------- navigation ---------- */
var state=null;
function menu(){
  homeBtn.hidden=true;state=null;app.innerHTML="";
  app.appendChild(el("p",{class:"intro"},"Quatre niveaux pour s'entraîner sur ce qu'on a découvert : <b>on peut rendre une eau limpide en la laissant reposer ou en la filtrant</b>. Mais limpide ne veut pas dire pure."));
  var m=el("div",{class:"menu"});
  LEVELS.forEach(function(lv,i){
    var s=stars[lv.id]||0,st="";for(var k=0;k<3;k++)st+=starSvg(k<s);
    var b=el("button",{class:"level",type:"button"},'<span class="num">Niveau '+(i+1)+'</span><span class="name">'+lv.name+'</span><span class="what">'+lv.what+'</span><span class="stars" aria-label="'+s+' étoiles sur 3">'+st+'</span>');
    b.onclick=function(){start(i)};m.appendChild(b);
  });
  app.appendChild(m);
}
function start(i){state={lv:i,step:0,good:0,firstTry:true};homeBtn.hidden=false;render()}
homeBtn.onclick=function(){if(canSpeak)try{speechSynthesis.cancel()}catch(e){};menu()};
function frame(){
  var lv=LEVELS[state.lv];app.innerHTML="";
  var s=el("section",{class:"screen"});
  var top=el("div",{class:"top"});top.appendChild(el("h2",null,"Niveau "+(state.lv+1)+" · "+lv.name));
  var p=el("div",{class:"progress","aria-label":"Question "+(state.step+1)+" sur "+lv.n});
  for(var k=0;k<lv.n;k++)p.appendChild(el("i",{class:k<state.step?"done":(k===state.step?"now":"")}));
  top.appendChild(p);s.appendChild(top);app.appendChild(s);return s;
}
function nextBtn(label,fn){var d=el("div",{class:"next"});var b=el("button",{class:"btn primary",type:"button"},label||"Suivant");b.onclick=fn;d.appendChild(b);setTimeout(function(){b.focus()},30);return d}
function advance(){if(state.firstTry)state.good++;state.step++;state.firstTry=true;render()}
function mark(ok){if(!ok)state.firstTry=false}
function choiceRow(options,correctIdx,onRight,onWrongMsg,host,stack){
  var row=el("div",{class:"choices"+(stack?" stack":"")}),fb=el("div");host.appendChild(row);host.appendChild(fb);
  options.forEach(function(o,i){var b=el("button",{class:"btn choice",type:"button"},o);
    b.onclick=function(){
      if(i===correctIdx){mark(true);b.classList.add("right");Array.prototype.forEach.call(row.children,function(c){c.disabled=true});fb.innerHTML="";onRight(fb)}
      else{mark(false);b.classList.add("wrong");b.disabled=true;fb.innerHTML="";fb.appendChild(feedback(false,"Regarde encore.",onWrongMsg(i)))}
    };row.appendChild(b)});
}
function render(){var lv=LEVELS[state.lv];if(state.step>=lv.n)return finish();[r1,r2,r3,r4][state.lv]()}

/* Niveau 1 */
function r1(){
  var s=frame();
  if(state.step===L1.length){
    s.appendChild(consigne("Quand on laisse reposer l'eau boueuse, pourquoi la terre tombe-t-elle au fond ?"));
    s.appendChild(el("div",{class:"scene"},'<svg viewBox="0 0 440 260" role="img" aria-label="Verre d\'eau qui a reposé, terre au fond">'+glass(220,.25,28,"après 20 minutes","")+'</svg>'));
    choiceRow(["Pour le même volume, la terre pèse plus que l'eau","L'eau pousse la terre vers le bas","La terre est fatiguée"],0,function(fb){
      fb.appendChild(feedback(true,"Exactement !","C'est comme l'huile et l'eau : pour le même volume, le plus lourd va en bas. La terre est plus lourde que l'eau, elle tombe."));s.appendChild(nextBtn("Voir mon score",advance))},
      function(){return "Souviens-toi de la balance : pour le même volume, le plus lourd va en bas."},s,true);return;
  }
  var q=L1[state.step];
  s.appendChild(consigne(q.txt+" C'est une décantation ou une filtration ?"));
  s.appendChild(el("p",{class:"situation"},q.txt));
  choiceRow(["Décantation : on laisse reposer","Filtration : on fait passer à travers des trous"],q.a,function(fb){
    fb.appendChild(feedback(true,"Juste !",q.a===0?"On ne touche à rien : les grains tombent au fond. C'est une décantation.":"Ce qui est petit passe par les trous, ce qui est gros reste. C'est une filtration."));s.appendChild(nextBtn(null,advance))},
    function(){return q.a===0?"Ici, on ne fait rien passer à travers des trous : on attend.":"Ici, on n'attend pas : on fait passer à travers des trous."},s,true);
}

/* Niveau 2 */
function r2(){
  var s=frame();
  if(state.step===L2.length){
    s.appendChild(consigne("Rania dit : la passoire laisserait passer la terre. A-t-elle raison ?"));
    choiceRow(["Oui, les trous de la passoire sont plus gros que les grains de terre","Non, la passoire retient tout"],0,function(fb){
      fb.appendChild(feedback(true,"Oui !","Pour savoir ce qui passe, on compare la taille des trous et la taille des grains."));s.appendChild(nextBtn("Voir mon score",advance))},
      function(){return "Regarde à nouveau les trous de la passoire et les grains de terre fine."},s,true);return;
  }
  var q=L2[state.step];
  s.appendChild(consigne("On verse de l'eau avec "+GRAINS[q.grain].name+" dans "+TOOLS[q.tool].name+". Est-ce que ça passe, ou est-ce que ça reste ?"));
  s.appendChild(el("div",{class:"scene"},sieveScene(q.tool,q.grain)));
  var g=GRAINS[q.grain].name.replace("des ","les ").replace("du ","le ").replace("de la ","la ");
  choiceRow(["Ça passe à travers","Ça reste dedans"],q.stay?1:0,function(fb){fb.appendChild(feedback(true,"Juste !",q.why));s.appendChild(nextBtn(null,advance))},
    function(){return q.grain==="sel"?"Le sel dissous ne forme plus de grains : il est mélangé à l'eau.":"Compare la taille des trous et la taille des grains : "+g+", c'est plus gros ou plus petit que les trous ?"},s);
}

/* Niveau 3 */
function r3(){
  var s=frame(),q=L3[state.step];
  s.appendChild(consigne(q.q));
  if(q.plate)s.appendChild(el("div",{class:"scene"},plate(true)));
  else if(state.step<2)s.appendChild(el("div",{class:"scene"},'<svg viewBox="0 0 440 270" role="img" aria-label="Eau boueuse et salée, puis eau filtrée limpide">'+glass(120,.85,0,"avant","eau boueuse + sel")+'<path d="M190 130 H250 M238 118 L252 130 L238 142" stroke="var(--ink)" stroke-width="3" fill="none" stroke-linecap="round"/>'+glass(320,0,0,"après le filtre","limpide")+'</svg>'));
  choiceRow(q.opts,q.a,function(fb){fb.appendChild(feedback(true,"Bien vu !",q.ok));s.appendChild(nextBtn(state.step===L3.length-1?"Voir mon score":null,advance))},
    function(){return q.ko},s,q.opts.length>2);
}

/* Niveau 4 */
function r4(){
  var s=frame(),q=L4[state.step];
  s.appendChild(consigne(q.who+" pensait : « "+q.idea+" » Voici le résultat. Son idée tient, ne tient pas, ou tient en partie ?"));
  var card=el("div",{class:"idea"},'<span class="tagline">L\'idée de '+q.who+'</span><p>« '+q.idea+' »</p>');s.appendChild(card);
  var pic;
  if(q.scene==="wait")pic='<svg viewBox="0 0 440 270">'+glass(120,.9,0,"au début","")+glass(320,.3,26,"après 20 min","")+'</svg>';
  else if(q.scene==="passoire")pic='<svg viewBox="0 0 440 270">'+glass(120,.9,0,"avant","")+glass(320,.85,0,"après la passoire","")+'</svg>';
  else if(q.scene==="filtre")pic='<svg viewBox="0 0 440 270">'+glass(120,.85,0,"après la passoire","")+glass(320,0,0,"après le filtre","")+'</svg>';
  else pic=plate(true);
  s.appendChild(el("div",{class:"scene photo"},pic));
  s.appendChild(el("p",{class:"result"},"<b>Résultat :</b> "+q.result));
  var z=el("div");s.appendChild(z);
  choiceRow(VERDICTS,q.verdict,function(fb){
    var z2=el("div");z.appendChild(z2);z2.appendChild(consigne("Quel « parce que » le prouve ? Choisis celui qui dit ce qu'on a vu."));
    choiceRow(q.reasons,q.good,function(fb2){fb2.appendChild(feedback(true,"C'est une preuve !","Ce « parce que » dit ce qu'on a vu pendant l'expérience. Une phrase de la leçon ne prouve rien sur cette expérience."));z2.appendChild(nextBtn(state.step===L4.length-1?"Voir mon score":null,advance))},
      function(i){return "Ce « parce que », est-ce que tu l'as vu, ou est-ce que tu l'as appris ? Cherche celui qui dit ce qu'on a vu."},z2,true);
  },function(i){return "Relis le résultat et compare avec l'idée de "+q.who+". "+(q.verdict===2?"Une partie se réalise, une partie non.":"")},z);
}

/* Fin */
function finish(){
  var lv=LEVELS[state.lv],n=lv.n,g=state.good,st=g===n?3:(g>=Math.ceil(n*0.6)?2:(g>0?1:0));
  if(st>(stars[lv.id]||0)){stars[lv.id]=st;saveStars(stars)}
  app.innerHTML="";var s=el("section",{class:"screen end"});
  var row="";for(var k=0;k<3;k++)row+=starSvg(k<st);
  s.innerHTML='<h2>Niveau '+(state.lv+1)+' terminé</h2><div class="stars big-stars" aria-label="'+st+' étoiles sur 3">'+row+'</div><p class="big">'+g+' / '+n+'</p><p class="muted">réponses justes du premier coup</p><p class="rule">Décanter : on laisse reposer, les grains tombent. Filtrer : les grains restent dans les trous.<br>Limpide ne veut pas dire pur : le sel dissous passe le filtre.</p>';
  var r=el("div",{class:"choices"});
  var again=el("button",{class:"btn",type:"button"},"Recommencer ce niveau");again.onclick=function(){start(state.lv)};r.appendChild(again);
  if(state.lv<LEVELS.length-1){var nx=el("button",{class:"btn primary",type:"button"},"Niveau suivant");var nlv=state.lv+1;nx.onclick=function(){start(nlv)};r.appendChild(nx)}
  var mb=el("button",{class:"btn ghost",type:"button"},"Tous les niveaux");mb.onclick=menu;r.appendChild(mb);
  s.appendChild(r);app.appendChild(s);
}
menu();
})();
</script>

</body>
</html>
